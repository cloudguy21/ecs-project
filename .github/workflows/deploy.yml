name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::478078664193:role/ecs-project-github-actions
          aws-region: us-east-1

      - name: Test AWS connection
        run: aws sts get-caller-identity