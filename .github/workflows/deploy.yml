name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get OIDC token claims
        run: |
          TOKEN=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::478078664193:role/ecs-project-github-actions
          aws-region: us-east-1

      - name: Test AWS connection
        run: aws sts get-caller-identity

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/ecs-project:${{ github.sha }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/ecs-project:${{ github.sha }}
      
      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Plan
        run: terraform -chdir=terraform plan -var="image_tag=${{ github.sha }}"
  
      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve -var="image_tag=${{ github.sha }}"    